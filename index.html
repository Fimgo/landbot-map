<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Вибрати на карті</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@geoman-io/leaflet-geoman-free@2.16.0/dist/leaflet-geoman.css"/>
  <script src="https://cdn.jsdelivr.net/npm/@geoman-io/leaflet-geoman-free@2.16.0/dist/leaflet-geoman.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: sans-serif; background: #f0f2f5; }
    /* 240px = worst-case controls height (223px with fields visible) + 17px buffer */
    #map { width: 100vw; height: calc(100vh - 240px); }
    #controls {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: #fff;
      padding: 12px 16px;
      box-shadow: 0 -2px 8px rgba(0,0,0,0.15);
      z-index: 1000;
    }
    #controls h3 { font-size: 14px; margin-bottom: 8px; color: #333; }
    .mode-btns { display: flex; gap: 8px; margin-bottom: 8px; }
    .mode-btn {
      flex: 1; padding: 8px; border: 2px solid #ccc;
      border-radius: 8px; background: #fff; cursor: pointer;
      font-size: 13px; transition: all .2s;
    }
    .mode-btn.active { border-color: #3b82f6; background: #eff6ff; color: #1d4ed8; }
    #info { font-size: 12px; color: #666; margin-bottom: 8px; min-height: 16px; }
    .input-row { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
    .field-group { display: flex; flex-direction: column; flex: 1; min-width: 70px; }
    .field-group label { font-size: 10px; color: #888; margin-bottom: 2px; }
    .field-group input {
      padding: 5px 6px; border: 1px solid #ccc; border-radius: 6px;
      font-size: 12px; width: 100%;
    }
    .field-group input:focus { outline: none; border-color: #3b82f6; }
    #debug-output {
      display: none; font-size: 11px; color: #555;
      word-break: break-all; margin-bottom: 6px;
      padding: 6px; background: #f8f8f8; border-radius: 6px;
    }
    #confirm-btn {
      width: 100%; padding: 12px; background: #3b82f6; color: #fff;
      border: none; border-radius: 10px; font-size: 15px;
      cursor: pointer; font-weight: 600;
    }
    #confirm-btn:disabled { background: #93c5fd; cursor: not-allowed; }
  </style>
</head>
<body>
<div id="map"></div>
<div id="controls">
  <h3>Виберіть зону пошуку</h3>
  <div class="mode-btns">
    <button class="mode-btn active" id="btn-circle" onclick="setMode('circle')">⭕ Коло</button>
    <button class="mode-btn" id="btn-bbox" onclick="setMode('bbox')">▭ Прямокутник</button>
    <button class="mode-btn" id="btn-clear" onclick="clearSelection()">🗑 Очистити</button>
  </div>
  <div id="info"></div>

  <div id="fields-circle" class="input-row" style="display:none">
    <div class="field-group">
      <label>Lat (центр)</label>
      <input id="f-lat" type="number" step="0.0001" placeholder="50.4501">
    </div>
    <div class="field-group">
      <label>Lon (центр)</label>
      <input id="f-lon" type="number" step="0.0001" placeholder="30.5234">
    </div>
    <div class="field-group">
      <label>Радіус (км)</label>
      <input id="f-radius" type="number" step="1" min="1" max="50" placeholder="5">
    </div>
  </div>

  <div id="fields-bbox" class="input-row" style="display:none">
    <div class="field-group">
      <label>min lat</label>
      <input id="f-minlat" type="number" step="0.0001">
    </div>
    <div class="field-group">
      <label>min lon</label>
      <input id="f-minlon" type="number" step="0.0001">
    </div>
    <div class="field-group">
      <label>max lat</label>
      <input id="f-maxlat" type="number" step="0.0001">
    </div>
    <div class="field-group">
      <label>max lon</label>
      <input id="f-maxlon" type="number" step="0.0001">
    </div>
  </div>

  <div id="debug-output"></div>
  <button id="confirm-btn" disabled onclick="confirmSelection()">✅ Підтвердити</button>
</div>

<script>
// ── Kyiv & Kyiv Oblast bounds ──────────────────────────────────────────────
const BOUNDS = L.latLngBounds(
  [49.2, 29.3],
  [51.5, 32.2]
);
const KYIV_CENTER = [50.4501, 30.5234];

// ── Telegram WebApp init ───────────────────────────────────────────────────
// tg declared before all functions so confirmSelection can safely check `if (tg)`
const tg = window.Telegram?.WebApp;
if (tg) {
  tg.ready();
  tg.expand();
}

// ── Map setup ─────────────────────────────────────────────────────────────
const map = L.map('map', {
  center: KYIV_CENTER,
  zoom: 10,
  maxBounds: BOUNDS,
  maxBoundsViscosity: 1.0,
});

L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
  attribution: '© OpenStreetMap contributors',
  maxZoom: 18,
}).addTo(map);

L.rectangle(BOUNDS, { color: '#3b82f6', weight: 2, fillOpacity: 0.03 }).addTo(map);

// ── State ─────────────────────────────────────────────────────────────────
let mode = 'circle';
let currentLayer = null;

// ── Utility ───────────────────────────────────────────────────────────────
function setInfo(msg) {
  document.getElementById('info').textContent = msg;
}

function setConfirmEnabled(v) {
  document.getElementById('confirm-btn').disabled = !v;
}

function showDebug(text) {
  const el = document.getElementById('debug-output');
  el.textContent = text;
  el.style.display = text ? 'block' : 'none';
}

// ── Geoman init ───────────────────────────────────────────────────────────
function initDraw() {
  map.pm.setGlobalOptions({ snappable: false, allowSelfIntersection: false });

  // pm:create fires when the user finishes drawing a shape.
  // Source confirmed in src/js/Mixins/Events.js at v2.16.0 tag.
  map.on('pm:create', (e) => {
    if (currentLayer) {
      currentLayer.pm.disable();
      map.removeLayer(currentLayer);
    }
    currentLayer = e.layer;

    // pm:change — fires during handle drag (confirmed for Rectangle in Edit.Rectangle.js v2.16.0).
    //             For Circle, may only fire on pm:edit or pm:centerplaced.
    // pm:edit   — fires after drag ends (confirmed for Rectangle; likely Circle via mixin).
    // pm:centerplaced — fires when Circle center is moved (docs + Mixins/Events.js v2.16.0).
    currentLayer.on('pm:change pm:edit pm:centerplaced', () => {
      updateInputsFromLayer(currentLayer);
    });

    currentLayer.pm.enable({ allowSelfIntersection: false });
    updateInputsFromLayer(currentLayer);
    setConfirmEnabled(true);
    map.pm.disableDraw();
    setInfo('Редагуйте форму або вручну введіть координати. Потім «Підтвердити».');
  });
}

// ── Map → input fields ────────────────────────────────────────────────────
function updateInputsFromLayer(layer) {
  // safeSet: skip a field if the user is currently focused on it
  function safeSet(id, val) {
    const el = document.getElementById(id);
    if (el && el !== document.activeElement) el.value = val;
  }
  if (mode === 'circle') {
    const c = layer.getLatLng();
    const r = layer.getRadius() / 1000;
    safeSet('f-lat',    c.lat.toFixed(4));
    safeSet('f-lon',    c.lng.toFixed(4));
    safeSet('f-radius', r.toFixed(1));
  } else {
    const b = layer.getBounds();
    safeSet('f-minlat', b.getSouth().toFixed(4));
    safeSet('f-minlon', b.getWest().toFixed(4));
    safeSet('f-maxlat', b.getNorth().toFixed(4));
    safeSet('f-maxlon', b.getEast().toFixed(4));
  }
}

// ── Input fields → map ────────────────────────────────────────────────────
// 'change' fires on blur or Enter — once per field edit, not on every keypress.
// pm.disable/enable runs once per field edit to reposition geoman's edit handles.
// Programmatic .value = x (in updateInputsFromLayer) does NOT fire 'change',
// so there is no feedback loop between this function and updateInputsFromLayer.
function onInputChange() {
  if (!currentLayer) return;
  if (mode === 'circle') {
    const lat = parseFloat(document.getElementById('f-lat').value);
    const lon = parseFloat(document.getElementById('f-lon').value);
    const r   = parseFloat(document.getElementById('f-radius').value);
    if ([lat, lon, r].some(isNaN)) return;
    if (lat < 49.0 || lat > 52.0 || lon < 28.0 || lon > 33.0) return;
    if (r < 1 || r > 50) return;
    currentLayer.pm.disable();
    currentLayer.setLatLng([lat, lon]);
    currentLayer.setRadius(r * 1000);
    currentLayer.pm.enable({ allowSelfIntersection: false });
  } else {
    const minlat = parseFloat(document.getElementById('f-minlat').value);
    const minlon = parseFloat(document.getElementById('f-minlon').value);
    const maxlat = parseFloat(document.getElementById('f-maxlat').value);
    const maxlon = parseFloat(document.getElementById('f-maxlon').value);
    if ([minlat, minlon, maxlat, maxlon].some(isNaN)) return;
    currentLayer.pm.disable();
    currentLayer.setBounds([[minlat, minlon], [maxlat, maxlon]]);
    currentLayer.pm.enable({ allowSelfIntersection: false });
  }
}

// ── Mode switch ───────────────────────────────────────────────────────────
// mode is set BEFORE clearSelection so clearSelection re-enables the correct draw tool.
// setMode → clearSelection is one-way; clearSelection does NOT call setMode.
function setMode(m) {
  mode = m;
  clearSelection();
  document.getElementById('btn-circle').classList.toggle('active', m === 'circle');
  document.getElementById('btn-bbox').classList.toggle('active', m === 'bbox');
  document.getElementById('fields-circle').style.display = m === 'circle' ? 'flex' : 'none';
  document.getElementById('fields-bbox').style.display   = m === 'bbox'   ? 'flex' : 'none';
}

// ── Clear ─────────────────────────────────────────────────────────────────
// Called by: setMode (via button click) and the 🗑 button directly.
// Does NOT call setMode or confirmSelection.
function clearSelection() {
  if (currentLayer) {
    currentLayer.pm.disable();
    map.removeLayer(currentLayer);
    currentLayer = null;
  }
  setConfirmEnabled(false);
  showDebug('');
  document.getElementById('fields-circle').querySelectorAll('input').forEach(el => el.value = '');
  document.getElementById('fields-bbox').querySelectorAll('input').forEach(el => el.value = '');
  map.pm.disableDraw();
  if (mode === 'circle') {
    map.pm.enableDraw('Circle', { continueDrawing: false, snappable: false });
    setInfo('Намалюйте коло на карті.');
  } else {
    map.pm.enableDraw('Rectangle', { continueDrawing: false, snappable: false });
    setInfo('Намалюйте прямокутник на карті.');
  }
}

// ── Confirm ───────────────────────────────────────────────────────────────
// Does NOT call setMode or clearSelection.
function confirmSelection() {
  if (!currentLayer) return;
  let data = null;
  if (mode === 'circle') {
    const c = currentLayer.getLatLng();
    const r = currentLayer.getRadius() / 1000;
    data = {
      type: 'circle',
      lat: parseFloat(c.lat.toFixed(6)),
      lon: parseFloat(c.lng.toFixed(6)),
      radius_km: Math.round(r * 10) / 10,
    };
  } else {
    const b = currentLayer.getBounds();
    data = {
      type: 'bbox',
      min_lat: parseFloat(b.getSouth().toFixed(6)),
      min_lon: parseFloat(b.getWest().toFixed(6)),
      max_lat: parseFloat(b.getNorth().toFixed(6)),
      max_lon: parseFloat(b.getEast().toFixed(6)),
    };
  }
  const json = JSON.stringify(data);
  if (json.length > 4096) {
    showDebug('⚠️ JSON завеликий: ' + json.length + ' байт');
    return;
  }
  if (tg) {
    tg.sendData(json);
  } else {
    showDebug('📤 Відправлено: ' + json);
  }
}

// ── Bind input change events ───────────────────────────────────────────────
// 'change' fires on blur or Enter, not on every keystroke.
['f-lat', 'f-lon', 'f-radius', 'f-minlat', 'f-minlon', 'f-maxlat', 'f-maxlon'].forEach(id => {
  const el = document.getElementById(id);
  if (el) el.addEventListener('change', onInputChange);
});

// ── Boot ──────────────────────────────────────────────────────────────────
initDraw();
setMode('circle');
</script>
</body>
</html>
